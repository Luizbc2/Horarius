services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend-Schedra
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DB_DIALECT: ${DB_DIALECT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL}
      DB_AUTO_SYNC: ${DB_AUTO_SYNC}
      AUTH_USER_NAME: ${AUTH_USER_NAME}
      AUTH_USER_EMAIL: ${AUTH_USER_EMAIL}
      AUTH_USER_CPF: ${AUTH_USER_CPF}
      AUTH_USER_PASSWORD: ${AUTH_USER_PASSWORD}
      AUTH_SEED_ENABLED: ${AUTH_SEED_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-240}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      METRICS_TOKEN: ${METRICS_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${BACKEND_PORT}:3333"
    volumes:
      - avatar_data:/app/uploads
    networks:
      - app
      - data

  frontend:
    build:
      context: ./Frontend-Schedra
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - app

volumes:
  mysql_data:
  avatar_data:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
